<!DOCTYPE html>
<html>
<head>
    <title>API 连接测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🔌 YOLOv8 API 连接测试</h1>
    
    <h2>测试 1: 根路径</h2>
    <button onclick="testRoot()">测试 http://localhost:8000/</button>
    <div id="result1" class="result"></div>

    <h2>测试 2: 使用代理</h2>
    <button onclick="testProxy()">测试 /api/ (代理)</button>
    <div id="result2" class="result"></div>

    <script>
        async function testRoot() {
            const result = document.getElementById('result1');
            result.textContent = '⏳ 测试中...';
            
            try {
                const response = await fetch('http://localhost:8000/');
                const data = await response.json();
                result.className = 'result success';
                result.textContent = '✅ 连接成功！\n\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'result error';
                result.textContent = '❌ 连接失败\n\n错误: ' + error.message;
            }
        }

        async function testProxy() {
            const result = document.getElementById('result2');
            result.textContent = '⏳ 测试中...';
            
            try {
                const response = await fetch('/api/');
                const data = await response.json();
                result.className = 'result success';
                result.textContent = '✅ 代理连接成功！\n\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'result error';
                result.textContent = '❌ 代理连接失败\n\n错误: ' + error.message;
            }
        }
    </script>
</body>
</html>
